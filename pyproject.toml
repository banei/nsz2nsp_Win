[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsz-converter"
version = "1.0.0"
description = "NSZ to NSP converter with GUI for Nintendo Switch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "tkinterdnd2>=0.3",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=8.0"]

[project.scripts]
nsz-converter = "nsz_converter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
